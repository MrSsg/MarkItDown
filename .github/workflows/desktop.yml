name: desktop

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build desktop release
        shell: pwsh
        env:
          MARKITDOWN_OCR_PUBLIC_KEYS_FILE: ${{ github.workspace }}\markitdown-desktop\app\ocr_public_keys.json
        run: ./markitdown-desktop/build_fast.ps1
      - name: Run desktop unit tests
        shell: pwsh
        working-directory: markitdown-desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.venv-build/Scripts/python.exe -m unittest discover -s tests -q
      - name: Test real executable
        shell: pwsh
        run: ./markitdown-desktop/test_release.ps1
